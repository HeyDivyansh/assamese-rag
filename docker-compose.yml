# Local full-stack for the Assamese RAG app.
#   postgres  — relational store
#   qdrant    — dense vectors
#   opensearch— BM25 (Indic-aware analyzer; ICU plugin installed on boot)
#   redis     — Celery broker/backend
#   minio     — S3-compatible object storage (+ minio-init creates the bucket)
#   migrate   — one-shot Alembic upgrade
#   api       — FastAPI (Swagger at :8000/docs)
#   worker    — Celery ingestion worker (embeddings via HF Inference when HF_TOKEN set)
#
# EMBEDDINGS: set HF_TOKEN in `.env` to use Hugging Face Inference API for BGE-M3.
# The worker/API then skip downloading the ~2 GB embedding model locally.
# Docker Desktop memory >= 4 GB is usually enough when HF_TOKEN is configured.
# Shared env for api/worker/migrate (override via `.env` if present).
x-app-env: &app-env
  POSTGRES_URL: postgresql+psycopg://postgres:postgres@postgres:5432/assamese_rag
  QDRANT_URL: http://qdrant:6333
  OPENSEARCH_URL: http://opensearch:9200
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: assamese-rag
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assamese_rag
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports: ["9200:9200"]
    volumes: ["osdata:/usr/share/opensearch/data"]
    # Install the ICU analysis plugin (Indic-script tokenization) then start.
    command: >
      bash -c "
      ./bin/opensearch-plugin list | grep -q analysis-icu ||
      ./bin/opensearch-plugin install --batch analysis-icu;
      ./opensearch-docker-entrypoint.sh"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 2; done;
      mc mb -p local/assamese-rag || true;
      exit 0"

  migrate:
    build: .
    command: alembic upgrade head
    environment: *app-env
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: *app-env
    env_file:
      - path: .env
        required: false
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - .:/app
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      qdrant: { condition: service_started }
      redis: { condition: service_started }
      minio: { condition: service_started }

  worker:
    build: .
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --loglevel=INFO
      --concurrency=1
      --max-memory-per-child=1500000
    environment: *app-env
    env_file:
      - path: .env
        required: false
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - .:/app
    # Worker stays light when HF_TOKEN handles embeddings; limit avoids runaway RAM.
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      qdrant: { condition: service_started }
      redis: { condition: service_started }
      minio: { condition: service_started }

volumes:
  pgdata:
  qdrantdata:
  osdata:
  miniodata:
